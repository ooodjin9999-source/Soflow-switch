<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SoFlow Direct Hex Switcher</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            background: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
        }
        button { 
            flex: 1; 
            border: none; 
            outline: none; 
            font-size: 2.8rem; 
            font-weight: 900; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            cursor: pointer; 
            transition: opacity 0.15s ease;
        }
        button:active { 
            opacity: 0.7; 
        }
        .sub { 
            font-size: 1rem; 
            font-weight: 600; 
            opacity: 0.75; 
            font-family: monospace;
            letter-spacing: 1px;
        }
        #b22 { 
            background: #1b3820; 
            color: #34c759; 
            border-bottom: 2px solid #111; 
        }
        #b27 { 
            background: #3b1d1d; 
            color: #ff453a; 
        }
        #status {
            position: fixed; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85); 
            color: #8e8e93; 
            font-size: 11px;
            font-weight: 700; 
            padding: 8px 16px; 
            border-radius: 20px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
            border: 1px solid #222;
        }
    </style>
</head>
<body>
    <button id="b22" onclick="sendHex('D707A90000dc8C')">
        22 KM/H
        <span class="sub">D707A90000dc8C</span>
    </button>
    
    <button id="b27" onclick="sendHex('D707A900010eBF')">
        27 KM/H
        <span class="sub">D707A900010eBF</span>
    </button>

    <div id="status">Ready</div>

    <script>
        let targetChar = null;
        let bluetoothDevice = null;

        function setStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        async function sendHex(hexStr) {
            try {
                if (!targetChar || !bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    setStatus('Scanning scooter...');
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [] 
                    });

                    setStatus('Connecting GATT...');
                    const server = await bluetoothDevice.gatt.connect();
                    
                    setStatus('Finding writable pipe...');
                    const services = await server.getPrimaryServices();
                    
                    for (let service of services) {
                        const chars = await service.getCharacteristics();
                        for (let char of chars) {
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                targetChar = char;
                                break;
                            }
                        }
                        if (targetChar) break;
                    }

                    if (!targetChar) throw new Error("No writable characteristic found!");
                }

                setStatus('Sending hex...');
                const cleanHex = hexStr.replace(/\s+/g, '');
                const bytes = new Uint8Array(cleanHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                
                const writeType = targetChar.properties.writeWithoutResponse ? 'writeWithoutResponse' : 'writeValueWithResponse';
                if (writeType === 'writeWithoutResponse') {
                    await targetChar.writeValueWithoutResponse(bytes);
                } else {
                    await targetChar.writeValue(bytes);
                }

                setStatus('Sent!');
                setTimeout(() => setStatus('Connected'), 1500);

            } catch (err) {
                console.error(err);
                setStatus('Error: ' + err.message);
                targetChar = null;
                bluetoothDevice = null;
            }
        }
    </script>
</body>
</html>
