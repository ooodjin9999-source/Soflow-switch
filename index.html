<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoFlow Speed Switcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0a0a; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #fff; 
            justify-content: center; 
            align-items: center; 
            gap: 20px;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        button { 
            width: 100%; 
            padding: 24px; 
            font-size: 22px; 
            font-weight: 700; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        button:active { transform: scale(0.98); opacity: 0.8; }
        #btn22 { background: #2c2c2e; color: #34c759; border: 2px solid #34c759; }
        #btn27 { background: #007aff; color: #fff; }
        #status { 
            font-size: 15px; 
            color: #8e8e93; 
            text-align: center; 
            min-height: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">Tap mode to connect & send payload</div>
        <button id="btn22" onclick="sendHex('D707A90000dc8C')">22 KM/H Mode</button>
        <button id="btn27" onclick="sendHex('D707A900010eBF')">27 KM/H Mode</button>
    </div>

    <script>
        let bluetoothDevice;
        let writableCharacteristic;

        function hexToBytes(hex) {
            let bytes = [];
            for (let c = 0; c < hex.length; c += 2) {
                bytes.push(parseInt(hex.substr(c, 2), 16));
            }
            return new Uint8Array(bytes);
        }

        async function sendHex(hexString) {
            const status = document.getElementById('status');
            try {
                if (!writableCharacteristic || !bluetoothDevice.gatt.connected) {
                    status.innerText = "Scanning for SoFlow...";
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [
                            "0000ffe0-0000-1000-8000-00805f9b34fb",
                            "6e400001-b5a3-f393-e0a9-e50e24dcca9e",
                            "0000fe00-0000-1000-8000-00805f9b34fb"
                        ]
                    });
                    
                    status.innerText = "Connecting GATT...";
                    const server = await bluetoothDevice.gatt.connect();
                    
                    status.innerText = "Locating writable characteristic...";
                    const services = await server.getPrimaryServices();
                    writableCharacteristic = null;
                    
                    for (let service of services) {
                        const characteristics = await service.getCharacteristics();
                        for (let characteristic of characteristics) {
                            if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                                writableCharacteristic = characteristic;
                                break;
                            }
                        }
                        if (writableCharacteristic) break;
                    }
                }

                if (!writableCharacteristic) {
                    throw new Error("No writable BLE characteristic found.");
                }

                status.innerText = "Transmitting hex payload...";
                let byteArray = hexToBytes(hexString);
                
                if (writableCharacteristic.properties.write) {
                    await writableCharacteristic.writeValueWithResponse(byteArray);
                } else {
                    await writableCharacteristic.writeValueWithoutResponse(byteArray);
                }
                
                status.innerText = "SUCCESS: " + (hexString.includes("0000dc8C") ? "22 km/h" : "27 km/h") + " set!";
            } catch (error) {
                status.innerText = "Error: " + error.message;
                writableCharacteristic = null;
            }
        }
    </script>
</body>
</html>
